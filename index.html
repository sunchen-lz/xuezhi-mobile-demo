<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f8">
  <title>学智律行 · 移动端 Demo</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css?v=mobile-20261021">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#cases" aria-label="学智律行首页">
        <img src="assets/brand-lockup.png" alt="学智律行定稿标志">
      </a>
      <div class="workspace-label">工作空间</div>
      <nav class="nav-list">
        <button class="nav-item" data-page="home"><span class="icon">⌂</span><span>工作台</span></button>
        <button class="nav-item active" data-page="cases"><span class="icon">▤</span><span>案件</span><span class="nav-count">12</span></button>
        <button class="nav-item" data-page="materials"><span class="icon">▧</span><span>材料</span></button>
        <button class="nav-item" data-page="review"><span class="icon">✎</span><span>审阅与定稿</span><span class="nav-dot"></span></button>
        <button class="nav-item" data-page="archive"><span class="icon">▣</span><span>归档</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sync-state"><i></i><span>数据已同步</span><small>刚刚</small></div>
        <button class="profile-button" id="profileButton">
          <span class="avatar">陈</span><span class="profile-copy"><strong>陈律师</strong><small>个人工作空间</small></span><span class="more">···</span>
        </button>
      </div>
    </aside>

    <div class="mobile-topbar">
      <a class="brand compact" href="#cases" aria-label="学智律行首页"><img src="assets/brand-lockup.png" alt="学智律行定稿标志"></a>
      <button class="icon-button" id="mobileSearch" aria-label="搜索" title="搜索">⌕</button>
    </div>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumbs"><span>工作空间</span><b>/</b><strong id="crumbCurrent">案件</strong></div>
        <div class="top-actions">
          <button class="icon-button search-trigger" id="searchTrigger" aria-label="搜索案件和材料" title="搜索">⌕</button>
          <button class="icon-button notification-button" aria-label="通知" title="通知">♧<i></i></button>
          <span class="top-divider"></span>
          <span class="today-label">周三，10月21日</span>
          <span class="avatar small-avatar">陈</span>
        </div>
      </header>
      <div id="pageRoot" class="page-root"></div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="移动端导航">
    <button data-page="home"><span>⌂</span><small>工作台</small></button>
    <button class="active" data-page="cases"><span>▤</span><small>案件</small></button>
    <button data-page="materials"><span>▧</span><small>材料</small></button>
    <button data-page="review"><span>✎</span><small>审阅</small><i></i></button>
    <button data-page="profile"><span>◉</span><small>我的</small></button>
  </nav>

  <input type="file" id="fileInput" hidden multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
